# Shared machine configuration. Run through dots to use the saved profile.
min_version = "2026.10.8"

[settings]
auto_install = false
task.run_auto_install = false

[vars]
ac_display_sleep = 15
ac_sleep = 0
battery_display_sleep = 5
battery_sleep = 5
battery_dim = 1

[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew:git" = "latest"
"brew:gh" = "latest"
"brew:fish" = "latest"
"brew:starship" = "latest"
"brew:uv" = "latest"
"brew:mas" = "latest"
"brew:jq" = "latest"
"brew:yq" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:wget" = "latest"
"brew:vim" = "latest"
"brew:grc" = "latest"
"brew:awscli" = "latest"
"brew:hashicorp/tap/terraform" = "latest"
"brew:terragrunt" = "latest"
"brew:ffmpeg" = "latest"
"brew:yt-dlp" = "latest"
# dots routes Warp installation to Casks/warp.rb; status uses public cask metadata.
"brew-cask:warp" = "latest"
"brew-cask:comet" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:google-gemini" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:bitwarden" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:todoist-app" = "latest"
"brew-cask:dropbox" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:whatsapp" = "latest"
"brew-cask:home-assistant" = "latest"
"brew-cask:trader-workstation" = "latest"
"brew-cask:wifiman" = "latest"
"brew-cask:pgadmin4" = "latest"
"brew-cask:reolink" = "latest"
"brew-cask:adobe-creative-cloud" = "latest"
"mas:967805235" = "latest"
"mas:497799835" = "latest"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[dotfiles]
"~/.config/fish/conf.d/10-lidan.fish" = { source = "config/fish/conf.d/10-lidan.fish", mode = "symlink" }
"~/.config/fish/functions" = { source = "config/fish/functions", mode = "symlink-each" }
"~/.config/starship.toml" = { source = "config/starship.toml", mode = "symlink" }
"~/.gitconfig" = { source = "config/git/config", mode = "symlink" }
"~/.config/git/ignore" = { source = "config/git/ignore", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "config/mise/config.toml", mode = "symlink" }
"~/.local/bin/dots" = { source = "bin/dots", mode = "symlink" }

# Link individual app preferences; never link their databases or entire data folders.
[dotfiles."~/.warp/settings.toml"]
source = "config/warp/settings.toml"
mode = "symlink"

[dotfiles."~/Library/Application Support/Cursor/User/settings.json"]
source = "config/cursor/settings.json"
mode = "symlink"

[dotfiles."~/Library/Application Support/Cursor/User/keybindings.json"]
source = "config/cursor/keybindings.json"
mode = "symlink"

[bootstrap.macos.dock]
orientation = "bottom"
tilesize = 54
magnification = true
largesize = 100
show_recents = false

[bootstrap.macos.finder]
sort_folders_first = true
save_new_documents_to_cloud = false

[bootstrap.macos.keyboard]
key_repeat = 1
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleLocale = "en_IL"
AppleLanguages = ["en-IL", "he-IL"]
AppleMeasurementUnits = "Centimeters"
AppleMetricUnits = true
AppleScrollAnimationEnabled = true
"com.apple.sound.beep.feedback" = true
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true
PMPrintingExpandedStateForPrint = true
PMPrintingExpandedStateForPrint2 = true
"com.apple.trackpad.forceClick" = true
"com.apple.trackpad.scaling" = 2.0
"com.apple.mouse.tapBehavior" = 1

[bootstrap.macos.defaults."com.apple.dock"]
minimize-to-application = true
show-process-indicators = true

[bootstrap.macos.defaults."com.apple.finder"]
FXDefaultSearchScope = "SCcf"
ShowExternalHardDrivesOnDesktop = true
ShowRemovableMediaOnDesktop = true
NewWindowTarget = "PfHm"

[bootstrap.macos.defaults."com.apple.screencapture"]
type = "png"

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true

[bootstrap.macos.defaults."com.apple.print.PrintingPrefs"]
"Quit When Finished" = true

[bootstrap.macos.defaults."com.apple.dt.Xcode"]
DVTTextIndentUsingTabs = false
AlwaysShowTabBar = true

[bootstrap.macos.defaults."com.apple.commerce"]
AutoUpdate = true

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Dragging = false
TrackpadRightClick = true
TrackpadPinch = true
TrackpadRotate = true
TrackpadTwoFingerDoubleTapGesture = true
TrackpadTwoFingerFromRightEdgeSwipeGesture = 3

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Dragging = false
TrackpadRightClick = true
TrackpadPinch = true
TrackpadRotate = true
TrackpadTwoFingerDoubleTapGesture = true
TrackpadTwoFingerFromRightEdgeSwipeGesture = 3

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.ImageCapture"
key = "disableHotPlug"
host = "current"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60"]
value = { enabled = true, value = { type = "standard", parameters = [32, 49, 1048576] } }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["61"]
value = { enabled = true, value = { type = "standard", parameters = [32, 49, 1048576] } }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]
value = { enabled = true, value = { type = "standard", parameters = [32, 49, 262144] } }

[bootstrap.macos.launchd.agents.lidan-dotfiles-update]
program = "~/.local/bin/dots"
args = ["update", "--background"]
start_calendar_interval = { hour = 11, minute = 0 }
process_type = "Background"
environment = { PATH = "/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/lidan-dotfiles-launchd.log"
stderr_path = "~/Library/Logs/lidan-dotfiles-launchd.err.log"

[tasks."pkg:add"]
raw = true
description = "Search, declare and install a package"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py add"

[tasks."machine:check"]
description = "Read-only machine drift report"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py check"

[tasks."machine:apply"]
raw = true
description = "Apply links and preferences"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py apply"

[tasks."machine:setup"]
raw = true
description = "Install all declared packages and configure the machine"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py setup"

[tasks."machine:update"]
description = "Upgrade declared host packages"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py update"

[tasks."github:setup"]
raw = true
description = "Authenticate GitHub and configure a machine SSH key"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py github"

[tasks."machine:system"]
raw = true
description = "Apply hostname, power and remaining macOS settings"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py system"

[tasks."check"]
description = "Run repository tests"
run = "python3 -m unittest discover -s tests -v"

[tasks."pkg:remove"]
raw = true
description = "Uninstall, remove all declarations, commit and push"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py remove"

[tasks."machine:sync"]
raw = true
description = "Pull, reconcile managed packages and apply settings"
run = "/opt/homebrew/bin/uv run --no-project --offline --no-python-downloads --python 3.13 scripts/dots.py sync"

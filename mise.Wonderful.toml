# Additions for Wonderful. Shared packages come from mise.toml.
[vars]
computer_name = "Lidan-Work-Macbook"

[tasks."wonderful:setup"]
description = "Install the Wonderful CLI"
run = "bash scripts/install-wful.sh"

[bootstrap.packages]
"brew:kubectx" = "latest"
"brew:goenv" = "latest"
"brew:nvm" = "latest"
"brew:node" = "latest"
"brew:delve" = "latest"
"brew:python@3.15" = "latest"
"brew:cloudflared" = "latest"
"brew:pnpm" = "latest"
"brew:devcontainer" = "latest"
"brew:libpq" = "latest"
"brew:pkgconf" = "latest"
"brew:pcre2" = "latest"
"brew:opus" = "latest"
"brew:opusfile" = "latest"
"brew:lame" = "latest"
"brew:protobuf" = "latest"
"brew:rustup" = "latest"
"brew:git-lfs" = "latest"
"brew:helm" = "latest"
"brew:kubernetes-cli" = "latest"
"brew-cask:azure-cli" = "latest"
"brew:azure/kubelogin/kubelogin" = "latest"
"brew:k9s" = "latest"
"brew-cask:linear" = "latest"
"brew-cask:cloudflare-warp" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:microsoft-teams" = "latest"
"brew-cask:okta-verify" = "latest"

[dotfiles]
"~/.config/git/profile" = { source = "config/git/Wonderful", mode = "symlink" }

# Pinned apps in the original Mac Dock order (2026-10-12).
[bootstrap.macos.dock]
apps = [
  "/System/Applications/Apps.app",
  "/Applications/Safari.app",
  "/Applications/Comet.app",
  "/System/Applications/Messages.app",
  "/System/Applications/Maps.app",
  "/System/Applications/Photos.app",
  "/System/Applications/FaceTime.app",
  "/System/Applications/App Store.app",
  "/System/Applications/Notes.app",
  "/System/Applications/Freeform.app",
  "/System/Applications/System Settings.app",
  "/Applications/Slack.app",
  "/System/Applications/iPhone Mirroring.app",
  "/Applications/Notion.app",
  "/Applications/Warp.app",
  "/Applications/WhatsApp.app",
  "/Applications/Spotify.app",
]
